<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Speedtest — Uji Kecepatan Jaringan</title>
<meta name="description" content="Uji ping, kecepatan unduh, dan unggah jaringan Anda langsung dari peramban. Tidak ada data yang disimpan di server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f12;
    --surface:#12181c;
    --line:#1e262b;
    --text:#e7edf0;
    --muted:#7c8b93;
    --accent:#e8a33d;
    --accent-soft:rgba(232,163,61,0.12);
    --good:#4caf7d;
    --bad:#e0645a;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Space Grotesk', system-ui, -apple-system, sans-serif;
    --circ:628.3185;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:32px 20px 40px;
  }

  .page{
    width:100%;
    max-width:520px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:36px;
  }

  .brand{
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .isp{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    text-align:right;
    max-width:65%;
  }

  .isp__dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--muted);
    flex:none;
    transition:background .3s ease;
  }
  .isp__dot[data-state="ok"]{ background:var(--good); }
  .isp__dot[data-state="error"]{ background:var(--bad); }

  .isp__name{ transition:opacity .25s ease; }

  main{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 24px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .gauge{
    position:relative;
    width:min(60vw, 240px);
    aspect-ratio:1/1;
    margin-bottom:28px;
  }

  .gauge svg{
    width:100%;
    height:100%;
    display:block;
  }

  .gauge__track{
    fill:none;
    stroke:var(--line);
    stroke-width:12;
  }

  .gauge__arc{
    fill:none;
    stroke:var(--accent);
    stroke-width:12;
    stroke-linecap:round;
    stroke-dasharray:var(--circ);
    stroke-dashoffset:var(--circ);
    transform:rotate(-90deg);
    transform-origin:50% 50%;
    transition:stroke-dashoffset .5s ease;
  }

  .gauge__readout{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }

  .gauge__value{
    font-family:var(--mono);
    font-size:clamp(30px, 8vw, 40px);
    font-weight:500;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .gauge__unit{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
  }

  .gauge__label{
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    width:100%;
    margin-bottom:28px;
  }

  .stat{
    text-align:center;
    padding:0 8px;
  }

  .stat + .stat{
    border-left:1px solid var(--line);
  }

  .stat__value{
    font-family:var(--mono);
    font-size:19px;
    font-variant-numeric:tabular-nums;
  }

  .stat__label{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
  }

  button.run{
    width:100%;
    padding:14px 20px;
    border-radius:10px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font-family:var(--sans);
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }

  button.run:hover:not(:disabled){
    background:var(--accent-soft);
  }

  button.run:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  button.run:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  .status{
    margin-top:16px;
    min-height:18px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }

  footer{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .gauge__arc, .isp__name{ transition:none; }
  }
</style>
</head>
<body>

<div class="page">

  <header>
    <div class="brand">Speedtest</div>
    <div class="isp">
      <span class="isp__dot" id="ispDot" data-state="loading"></span>
      <span class="isp__name" id="ispName">Mendeteksi penyedia layanan…</span>
    </div>
  </header>

  <main>
    <div class="gauge">
      <svg viewBox="0 0 240 240">
        <circle class="gauge__track" cx="120" cy="120" r="100"></circle>
        <circle class="gauge__arc" id="gaugeArc" cx="120" cy="120" r="100"></circle>
      </svg>
      <div class="gauge__readout">
        <span class="gauge__value" id="gaugeValue">--</span>
        <span class="gauge__unit" id="gaugeUnit">Mbps</span>
        <span class="gauge__label" id="gaugeLabel">Menunggu</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat__value" id="statPing">--</div>
        <div class="stat__label">Ping</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="statDown">--</div>
        <div class="stat__label">Unduh</div>
      </div>
      <div class="stat">
        <div class="stat__value" id="statUp">--</div>
        <div class="stat__label">Unggah</div>
      </div>
    </div>

    <button type="button" class="run" id="runBtn">Mulai pengujian</button>
    <div class="status" id="statusLine" role="status" aria-live="polite">Siap menguji koneksi Anda.</div>
  </main>

  <footer>
    Pengujian berjalan sepenuhnya di peramban Anda melalui jaringan Cloudflare.
    Alamat IP tidak pernah ditampilkan maupun disimpan — hanya nama penyedia layanan yang ditampilkan.
  </footer>

</div>

<script type="module">
  const CIRC = 628.3185;

  const el = {
    ispDot: document.getElementById('ispDot'),
    ispName: document.getElementById('ispName'),
    gaugeArc: document.getElementById('gaugeArc'),
    gaugeValue: document.getElementById('gaugeValue'),
    gaugeUnit: document.getElementById('gaugeUnit'),
    gaugeLabel: document.getElementById('gaugeLabel'),
    statPing: document.getElementById('statPing'),
    statDown: document.getElementById('statDown'),
    statUp: document.getElementById('statUp'),
    runBtn: document.getElementById('runBtn'),
    statusLine: document.getElementById('statusLine'),
  };

  const PHASE_TEXT = {
    idle: 'Siap menguji koneksi Anda.',
    latency: 'Mengukur latensi…',
    download: 'Mengukur kecepatan unduh…',
    upload: 'Mengukur kecepatan unggah…',
    done: 'Pengujian selesai.',
    error: 'Pengujian gagal. Periksa koneksi lalu coba lagi.',
  };

  const GAUGE_LABEL = {
    idle: 'Menunggu',
    latency: 'Latensi',
    download: 'Unduh',
    upload: 'Unggah',
  };

  function setStatus(phase){
    el.statusLine.textContent = PHASE_TEXT[phase] || '';
  }

  function setGauge(kind, value){
    const max = kind === 'latency' ? 200 : 1000;
    const frac = Math.max(0, Math.min(1, value / max));
    el.gaugeArc.style.strokeDashoffset = String(CIRC * (1 - frac));
    el.gaugeValue.textContent = kind === 'latency'
      ? Math.round(value).toString()
      : (value < 10 ? value.toFixed(2) : value.toFixed(1));
    el.gaugeUnit.textContent = kind === 'latency' ? 'ms' : 'Mbps';
    el.gaugeLabel.textContent = GAUGE_LABEL[kind] || '';
  }

  function resetGauge(){
    el.gaugeArc.style.strokeDashoffset = String(CIRC);
    el.gaugeValue.textContent = '--';
    el.gaugeUnit.textContent = 'Mbps';
    el.gaugeLabel.textContent = GAUGE_LABEL.idle;
  }

  function fmtMs(ms){
    return Math.round(ms) + ' ms';
  }

  function fmtMbps(bps){
    const mbps = bps / 1e6;
    return (mbps < 10 ? mbps.toFixed(2) : mbps.toFixed(1)) + ' Mbps';
  }

  // --- Provider detection (name only, IP is fetched but never read or shown) ---
  async function detectProvider(){
    try{
      const res = await fetch('https://ipwho.is/', { cache: 'no-store' });
      if(!res.ok) throw new Error('lookup failed');
      const data = await res.json();
      if(!data || data.success === false) throw new Error('lookup failed');
      const isp = (data.connection && (data.connection.isp || data.connection.org)) || null;
      if(!isp) throw new Error('no isp field');
      el.ispName.textContent = String(isp);
      el.ispDot.dataset.state = 'ok';
    } catch(e){
      el.ispName.textContent = 'Penyedia layanan tidak terdeteksi';
      el.ispDot.dataset.state = 'error';
    }
  }
  detectProvider();

  // --- Speed test engine (Cloudflare's public measurement endpoints) ---
  let enginePromise = null;
  function loadEngine(){
    if(!enginePromise){
      enginePromise = import('https://cdn.skypack.dev/@cloudflare/speedtest')
        .then((m) => m.default)
        .catch((err) => { enginePromise = null; throw err; });
    }
    return enginePromise;
  }

  let hasRunOnce = false;

  async function runTest(){
    el.runBtn.disabled = true;
    resetGauge();
    el.statPing.textContent = '--';
    el.statDown.textContent = '--';
    el.statUp.textContent = '--';
    setStatus('latency');

    let SpeedTest;
    try{
      SpeedTest = await loadEngine();
    } catch(e){
      setStatus('error');
      el.runBtn.disabled = false;
      return;
    }

    const engine = new SpeedTest({ autoStart: false });

    engine.onResultsChange = ({ type }) => {
      const r = engine.results;
      if(type === 'latency'){
        setStatus('latency');
        const ms = r.getUnloadedLatency && r.getUnloadedLatency();
        if(typeof ms === 'number' && !Number.isNaN(ms)){
          setGauge('latency', ms);
          el.statPing.textContent = fmtMs(ms);
        }
      } else if(type === 'download'){
        setStatus('download');
        const bps = r.getDownloadBandwidth && r.getDownloadBandwidth();
        if(typeof bps === 'number' && !Number.isNaN(bps)){
          setGauge('download', bps / 1e6);
          el.statDown.textContent = fmtMbps(bps);
        }
      } else if(type === 'upload'){
        setStatus('upload');
        const bps = r.getUploadBandwidth && r.getUploadBandwidth();
        if(typeof bps === 'number' && !Number.isNaN(bps)){
          setGauge('upload', bps / 1e6);
          el.statUp.textContent = fmtMbps(bps);
        }
      }
    };

    engine.onFinish = (results) => {
      const summary = results.getSummary();
      if(typeof summary.latency === 'number') el.statPing.textContent = fmtMs(summary.latency);
      if(typeof summary.download === 'number') el.statDown.textContent = fmtMbps(summary.download);
      if(typeof summary.upload === 'number') el.statUp.textContent = fmtMbps(summary.upload);
      setStatus('done');
      hasRunOnce = true;
      el.runBtn.textContent = 'Uji lagi';
      el.runBtn.disabled = false;
    };

    engine.onError = () => {
      setStatus('error');
      el.runBtn.disabled = false;
    };

    engine.play();
  }

  el.runBtn.addEventListener('click', runTest);
</script>

</body>
</html>
