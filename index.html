<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speedtest</title>
<meta name="description" content="Tes kecepatan internet: ping, unduh, dan unggah — diproses langsung di peramban Anda, tanpa menampilkan atau menyimpan alamat IP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A;
    --bg-2:#0E1626;
    --panel:#111A2C;
    --panel-line:rgba(234,240,255,0.08);
    --ink:#EAF0FF;
    --muted:#7C88A6;
    --muted-dim:#4E5872;
    --accent:#31D8C4;
    --accent-2:#4C7DFF;
    --warn:#FF6B5B;
    --track:rgba(234,240,255,0.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(76,125,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(49,216,196,0.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    min-height:100%;
  }
  main.card{
    width:100%;
    max-width:520px;
    background:linear-gradient(180deg, var(--panel), var(--bg-2));
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:clamp(24px,5vw,40px);
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.6);
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand-dot{
    width:9px; height:9px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 0 4px rgba(49,216,196,0.12);
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .provider-badge{
    font-size:12.5px;
    color:var(--muted);
    background:rgba(234,240,255,0.05);
    border:1px solid var(--panel-line);
    padding:6px 11px;
    border-radius:100px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .gauge-wrap{
    position:relative;
    width:min(280px, 72vw);
    margin:6px auto 6px;
    aspect-ratio:1/1;
  }
  .gauge-wrap svg{ width:100%; height:100%; display:block; }
  .gauge-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-bottom:6%;
  }
  .gauge-value{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(38px,10vw,52px);
    line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg, #fff, #C9D4F5);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .gauge-unit{
    font-size:13px;
    color:var(--muted);
    margin-top:6px;
    letter-spacing:0.02em;
  }
  .phase-label{
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    margin:2px 0 26px;
    min-height:18px;
  }
  .phase-label.error{ color:var(--warn); }

  .tiles{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .tile{
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:13px 8px;
    text-align:center;
    background:rgba(234,240,255,0.02);
    transition:border-color .3s ease, background .3s ease, opacity .3s ease;
    opacity:.55;
  }
  .tile.active{
    opacity:1;
    border-color:var(--accent);
    background:rgba(49,216,196,0.06);
  }
  .tile.done{ opacity:1; }
  .tile.error{ opacity:1; border-color:var(--warn); background:rgba(255,107,91,0.06); }
  .tile-icon{
    width:18px; height:18px;
    margin:0 auto 8px;
    color:var(--muted);
    display:block;
  }
  .tile.active .tile-icon, .tile.done .tile-icon{ color:var(--accent); }
  .tile.error .tile-icon{ color:var(--warn); }
  .tile-label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .tile-value{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
    font-variant-numeric:tabular-nums;
  }

  .start-btn{
    display:block;
    width:100%;
    padding:15px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#04120F;
    border:none;
    border-radius:12px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:0.01em;
  }
  .start-btn:hover:not(:disabled){ filter:brightness(1.06); }
  .start-btn:active:not(:disabled){ filter:brightness(0.96); }
  .start-btn:disabled{ opacity:.5; cursor:not-allowed; filter:none; }

  .note{
    text-align:center;
    font-size:11.5px;
    color:var(--muted-dim);
    margin:16px 0 0;
    line-height:1.55;
  }

  @media (max-width:420px){
    header.top{ flex-direction:column; align-items:flex-start; }
    .tile-label{ font-size:10.5px; }
    .tile-value{ font-size:14px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>Speedtest</h1>
    </div>
    <span class="provider-badge" id="provider">Mendeteksi penyedia layanan…</span>
  </header>

  <div class="gauge-wrap">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <path id="arcTrack" d="M54.95 185.05 A92 92 0 1 1 185.05 185.05" fill="none" stroke="var(--track)" stroke-width="14" stroke-linecap="round"/>
      <path id="arcFill" d="M54.95 185.05 A92 92 0 1 1 185.05 185.05" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round"/>
      <defs>
        <linearGradient id="gaugeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#31D8C4"/>
          <stop offset="100%" stop-color="#4C7DFF"/>
        </linearGradient>
      </defs>
      <g id="needle">
        <line x1="120" y1="120" x2="120" y2="42" stroke="#EAF0FF" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="120" r="7" fill="#EAF0FF"/>
      </g>
    </svg>
    <div class="gauge-center">
      <div class="gauge-value" id="readoutValue">0</div>
      <div class="gauge-unit" id="readoutUnit">Mbps</div>
    </div>
  </div>
  <p class="phase-label" id="phaseLabel">Siap memulai</p>

  <div class="tiles" id="tiles">
    <div class="tile" data-step="ping">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 12l3-2"/></svg>
      <span class="tile-label">Ping</span>
      <span class="tile-value" id="val-ping">—</span>
    </div>
    <div class="tile" data-step="download">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg>
      <span class="tile-label">Unduh</span>
      <span class="tile-value" id="val-download">—</span>
    </div>
    <div class="tile" data-step="upload">
      <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="M18 13l-6-6-6 6"/><path d="M4 21h16"/></svg>
      <span class="tile-label">Unggah</span>
      <span class="tile-value" id="val-upload">—</span>
    </div>
  </div>

  <button class="start-btn" id="startBtn">Mulai tes</button>
  <p class="note">Pengukuran diproses langsung di peramban Anda melalui koneksi terenkripsi (HTTPS). Alamat IP tidak ditampilkan maupun disimpan di halaman ini.</p>
</main>

<script>
(function(){
  const els = {
    provider: document.getElementById('provider'),
    readoutValue: document.getElementById('readoutValue'),
    readoutUnit: document.getElementById('readoutUnit'),
    phaseLabel: document.getElementById('phaseLabel'),
    arcFill: document.getElementById('arcFill'),
    needle: document.getElementById('needle'),
    startBtn: document.getElementById('startBtn'),
    tiles: {
      ping: document.querySelector('.tile[data-step="ping"]'),
      download: document.querySelector('.tile[data-step="download"]'),
      upload: document.querySelector('.tile[data-step="upload"]'),
    },
    vals: {
      ping: document.getElementById('val-ping'),
      download: document.getElementById('val-download'),
      upload: document.getElementById('val-upload'),
    }
  };

  const DOWN_URL = (bytes) => `https://speed.cloudflare.com/__down?bytes=${bytes}&x=${Date.now()}-${Math.random()}`;
  const UP_URL = 'https://speed.cloudflare.com/__up';

  const ARC_LEN = els.arcFill.getTotalLength();
  els.arcFill.style.strokeDasharray = ARC_LEN;
  els.arcFill.style.strokeDashoffset = ARC_LEN;

  const GAUGE = {
    ping: { max: 300 },   // ms
    mbps: { max: 600 },   // Mbps (sqrt scaled)
  };

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function fracForPing(ms){ return clamp01(ms / GAUGE.ping.max); }
  function fracForMbps(v){ return clamp01(Math.sqrt(Math.min(v, GAUGE.mbps.max) / GAUGE.mbps.max)); }

  function renderGauge(frac){
    frac = clamp01(frac);
    els.arcFill.style.strokeDashoffset = ARC_LEN * (1 - frac);
    const angle = -135 + frac * 270;
    els.needle.setAttribute('transform', `rotate(${angle} 120 120)`);
  }

  // ---- Smooth animated readout ----
  let animId = null;
  let displayVal = 0;
  let targetVal = 0;
  let fracFn = fracForMbps;

  function startAnim(){
    stopAnim();
    function tick(){
      displayVal += (targetVal - displayVal) * 0.18;
      if(Math.abs(targetVal - displayVal) < 0.05) displayVal = targetVal;
      renderReadout(displayVal);
      animId = requestAnimationFrame(tick);
    }
    animId = requestAnimationFrame(tick);
  }
  function stopAnim(){
    if(animId) cancelAnimationFrame(animId);
    animId = null;
  }
  function renderReadout(v){
    els.readoutValue.textContent = fmtValue(v);
    renderGauge(fracFn(v));
  }
  function fmtValue(v){
    if(els.readoutUnit.textContent === 'ms') return Math.round(v).toString();
    return v >= 100 ? v.toFixed(0) : v.toFixed(1);
  }
  function setTarget(v){ targetVal = v; }
  function snapTo(v){ targetVal = v; displayVal = v; renderReadout(v); }

  function setUnit(unit){
    els.readoutUnit.textContent = unit;
    fracFn = unit === 'ms' ? fracForPing : fracForMbps;
  }

  function setActiveTile(name){
    Object.entries(els.tiles).forEach(([key, node]) => {
      node.classList.toggle('active', key === name);
    });
  }
  function markDone(name, text){
    const node = els.tiles[name];
    node.classList.remove('active');
    node.classList.add('done');
    els.vals[name].textContent = text;
  }
  function markError(name){
    const node = els.tiles[name];
    node.classList.remove('active');
    node.classList.add('error');
    els.vals[name].textContent = 'Gagal';
  }

  // ---- Provider detection (name only, IP never read or shown) ----
  async function loadProvider(){
    try{
      const res = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
      const data = await res.json();
      const name = data.org || data.isp || data.company || null;
      els.provider.textContent = name ? `Terhubung melalui ${name}` : 'Penyedia layanan tidak terdeteksi';
    }catch(e){
      els.provider.textContent = 'Penyedia layanan tidak terdeteksi';
    }
  }

  // ---- Ping ----
  async function measurePing(count){
    const samples = [];
    for(let i=0; i<count; i++){
      const t0 = performance.now();
      try{
        await fetch(DOWN_URL(0), { cache: 'no-store', mode: 'cors' });
      }catch(e){
        continue;
      }
      const rtt = performance.now() - t0;
      if(i > 0){
        samples.push(rtt);
        setTarget(rtt);
      }
    }
    if(samples.length === 0) throw new Error('ping failed');
    samples.sort((a,b) => a - b);
    return samples[Math.floor(samples.length / 2)];
  }

  // ---- Download ----
  function measureDownload(bytes, onProgress){
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', DOWN_URL(bytes), true);
      xhr.responseType = 'arraybuffer';
      const start = performance.now();
      xhr.onprogress = (e) => {
        const elapsed = (performance.now() - start) / 1000;
        if(elapsed > 0.05 && e.loaded > 0){
          const mbps = (e.loaded * 8) / elapsed / 1_000_000;
          onProgress(mbps);
        }
      };
      xhr.onload = () => {
        const elapsed = (performance.now() - start) / 1000;
        const total = xhr.response ? xhr.response.byteLength : bytes;
        resolve((total * 8) / elapsed / 1_000_000);
      };
      xhr.onerror = () => reject(new Error('download failed'));
      xhr.send();
    });
  }

  // ---- Upload ----
  function randomBlob(bytes){
    const arr = new Uint8Array(bytes);
    const chunk = 65536;
    for(let i=0; i<bytes; i+=chunk){
      crypto.getRandomValues(arr.subarray(i, Math.min(i + chunk, bytes)));
    }
    return new Blob([arr]);
  }

  function measureUpload(bytes, onProgress){
    return new Promise((resolve, reject) => {
      const blob = randomBlob(bytes);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', UP_URL, true);
      const start = performance.now();
      xhr.upload.onprogress = (e) => {
        const elapsed = (performance.now() - start) / 1000;
        if(elapsed > 0.05 && e.loaded > 0){
          const mbps = (e.loaded * 8) / elapsed / 1_000_000;
          onProgress(mbps);
        }
      };
      xhr.onload = () => {
        const elapsed = (performance.now() - start) / 1000;
        resolve((bytes * 8) / elapsed / 1_000_000);
      };
      xhr.onerror = () => reject(new Error('upload failed'));
      xhr.send(blob);
    });
  }

  function fmtMbps(v){
    return v >= 100 ? v.toFixed(0) : v.toFixed(1);
  }

  async function runTest(){
    els.startBtn.disabled = true;
    els.startBtn.textContent = 'Sedang menguji…';
    Object.values(els.tiles).forEach(t => t.classList.remove('active','done','error'));
    Object.values(els.vals).forEach(v => v.textContent = '—');
    els.phaseLabel.classList.remove('error');
    startAnim();

    // Ping
    els.phaseLabel.textContent = 'Mengukur ping';
    setActiveTile('ping');
    setUnit('ms');
    snapTo(0);
    try{
      const ping = await measurePing(6);
      markDone('ping', Math.round(ping) + ' ms');
      snapTo(ping);
    }catch(e){
      markError('ping');
      els.phaseLabel.textContent = 'Ping gagal';
      els.phaseLabel.classList.add('error');
    }
    await new Promise(r => setTimeout(r, 350));

    // Download
    els.phaseLabel.textContent = 'Mengukur kecepatan unduh';
    els.phaseLabel.classList.remove('error');
    setActiveTile('download');
    setUnit('Mbps');
    snapTo(0);
    try{
      const down = await measureDownload(30_000_000, (mbps) => setTarget(mbps));
      markDone('download', fmtMbps(down) + ' Mbps');
      snapTo(down);
    }catch(e){
      markError('download');
      els.phaseLabel.textContent = 'Unduh gagal';
      els.phaseLabel.classList.add('error');
    }
    await new Promise(r => setTimeout(r, 350));

    // Upload
    els.phaseLabel.textContent = 'Mengukur kecepatan unggah';
    els.phaseLabel.classList.remove('error');
    setActiveTile('upload');
    setUnit('Mbps');
    snapTo(0);
    try{
      const up = await measureUpload(10_000_000, (mbps) => setTarget(mbps));
      markDone('upload', fmtMbps(up) + ' Mbps');
      snapTo(up);
    }catch(e){
      markError('upload');
      els.phaseLabel.textContent = 'Unggah gagal';
      els.phaseLabel.classList.add('error');
    }

    stopAnim();
    setActiveTile(null);
    if(!els.phaseLabel.classList.contains('error')){
      els.phaseLabel.textContent = 'Tes selesai';
    }
    els.startBtn.disabled = false;
    els.startBtn.textContent = 'Tes ulang';
  }

  els.startBtn.addEventListener('click', runTest);
  loadProvider();
  renderGauge(0);
})();
</script>
</body>
</html>
