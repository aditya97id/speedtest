<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speedtest</title>
<meta name="description" content="Tes kecepatan internet: ping, unduh, dan unggah — diproses langsung di peramban Anda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFEC;
    --panel-bg:#F8F9F6;
    --ink:#14181B;
    --muted:#5B6560;
    --accent:#1856F2;
    --warn:#B4791F;
    --line:rgba(20,24,27,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  main.panel{
    width:100%;
    max-width:620px;
    background:var(--panel-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:clamp(28px,5vw,48px);
  }
  header.plate{
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:32px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:clamp(24px,4vw,30px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .provider{
    font-size:13px;
    color:var(--muted);
    margin:0;
    text-align:right;
  }
  .readout-wrap{ text-align:center; margin-bottom:34px; }
  .readout{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(46px,11vw,68px);
    font-weight:500;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .readout .unit{
    font-size:0.32em;
    color:var(--muted);
    margin-left:8px;
  }
  .phase-label{
    font-size:13px;
    color:var(--muted);
    margin:8px 0 0;
    min-height:18px;
  }
  .progress-track{
    height:3px;
    background:var(--line);
    border-radius:2px;
    margin-top:18px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .12s linear;
  }
  .steps{
    display:flex;
    gap:12px;
    margin-bottom:32px;
  }
  .step{
    flex:1;
    text-align:center;
    padding:14px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    opacity:.5;
    transition:opacity .3s ease, border-color .3s ease;
  }
  .step.active{ opacity:1; border-color:var(--accent); }
  .step.done{ opacity:1; }
  .step.error{ opacity:1; border-color:var(--warn); }
  .step-label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .step-value{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:18px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .start-btn{
    display:block;
    width:100%;
    padding:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  .start-btn:hover:not(:disabled){ background:var(--accent); }
  .start-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .note{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin:16px 0 0;
    line-height:1.5;
  }
  @media (max-width:480px){
    .steps{ flex-direction:column; }
    header.plate{ flex-direction:column; align-items:flex-start; }
    .provider{ text-align:left; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main class="panel">
  <header class="plate">
    <h1>Speedtest</h1>
    <p class="provider" id="provider">Mendeteksi penyedia layanan…</p>
  </header>

  <div class="readout-wrap">
    <div class="readout"><span id="readoutValue">0</span><span class="unit" id="readoutUnit">ms</span></div>
    <p class="phase-label" id="phaseLabel">Siap memulai</p>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="steps" id="steps">
    <div class="step" data-step="ping">
      <span class="step-label">Ping</span>
      <span class="step-value" id="val-ping">—</span>
    </div>
    <div class="step" data-step="download">
      <span class="step-label">Unduh</span>
      <span class="step-value" id="val-download">—</span>
    </div>
    <div class="step" data-step="upload">
      <span class="step-label">Unggah</span>
      <span class="step-value" id="val-upload">—</span>
    </div>
  </div>

  <button class="start-btn" id="startBtn">Mulai tes</button>
  <p class="note">Pengukuran diproses langsung di peramban Anda melalui koneksi terenkripsi (HTTPS). Alamat IP tidak ditampilkan maupun disimpan di halaman ini.</p>
</main>

<script>
(function(){
  const els = {
    provider: document.getElementById('provider'),
    readoutValue: document.getElementById('readoutValue'),
    readoutUnit: document.getElementById('readoutUnit'),
    phaseLabel: document.getElementById('phaseLabel'),
    progressFill: document.getElementById('progressFill'),
    startBtn: document.getElementById('startBtn'),
    steps: {
      ping: document.querySelector('.step[data-step="ping"]'),
      download: document.querySelector('.step[data-step="download"]'),
      upload: document.querySelector('.step[data-step="upload"]'),
    },
    vals: {
      ping: document.getElementById('val-ping'),
      download: document.getElementById('val-download'),
      upload: document.getElementById('val-upload'),
    }
  };

  const DOWN_URL = (bytes) => `https://speed.cloudflare.com/__down?bytes=${bytes}&x=${Date.now()}-${Math.random()}`;
  const UP_URL = 'https://speed.cloudflare.com/__up';

  function setReadout(value, unit){
    els.readoutValue.textContent = value;
    els.readoutUnit.textContent = unit;
  }

  function setProgress(fraction){
    els.progressFill.style.width = Math.max(0, Math.min(1, fraction)) * 100 + '%';
  }

  function setActiveStep(name){
    Object.entries(els.steps).forEach(([key, node]) => {
      node.classList.toggle('active', key === name);
    });
  }

  function markDone(name, text){
    const node = els.steps[name];
    node.classList.remove('active');
    node.classList.add('done');
    els.vals[name].textContent = text;
  }

  function markError(name){
    const node = els.steps[name];
    node.classList.remove('active');
    node.classList.add('error');
    els.vals[name].textContent = 'Gagal';
  }

  // ---- Provider detection (name only, no IP shown) ----
  async function loadProvider(){
    try{
      const res = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
      const data = await res.json();
      const name = data.org || data.isp || data.company || null;
      els.provider.textContent = name ? `Terhubung melalui ${name}` : 'Penyedia layanan tidak terdeteksi';
    }catch(e){
      els.provider.textContent = 'Penyedia layanan tidak terdeteksi';
    }
  }

  // ---- Ping ----
  async function measurePing(count){
    const samples = [];
    for(let i=0; i<count; i++){
      const t0 = performance.now();
      try{
        await fetch(DOWN_URL(0), { cache: 'no-store', mode: 'cors' });
      }catch(e){
        continue;
      }
      const rtt = performance.now() - t0;
      if(i > 0) samples.push(rtt); // first request warms up the connection
      setReadout(Math.round(rtt), 'ms');
      setProgress((i + 1) / count);
    }
    if(samples.length === 0) throw new Error('ping failed');
    samples.sort((a,b) => a - b);
    return samples[Math.floor(samples.length / 2)];
  }

  // ---- Download ----
  function measureDownload(bytes, onProgress){
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', DOWN_URL(bytes), true);
      xhr.responseType = 'arraybuffer';
      const start = performance.now();
      xhr.onprogress = (e) => {
        const elapsed = (performance.now() - start) / 1000;
        if(elapsed > 0.05 && e.loaded > 0){
          const mbps = (e.loaded * 8) / elapsed / 1_000_000;
          onProgress(mbps, e.loaded / bytes);
        }
      };
      xhr.onload = () => {
        const elapsed = (performance.now() - start) / 1000;
        const total = xhr.response ? xhr.response.byteLength : bytes;
        resolve((total * 8) / elapsed / 1_000_000);
      };
      xhr.onerror = () => reject(new Error('download failed'));
      xhr.send();
    });
  }

  // ---- Upload ----
  function randomBlob(bytes){
    const arr = new Uint8Array(bytes);
    const chunk = 65536;
    for(let i=0; i<bytes; i+=chunk){
      crypto.getRandomValues(arr.subarray(i, Math.min(i + chunk, bytes)));
    }
    return new Blob([arr]);
  }

  function measureUpload(bytes, onProgress){
    return new Promise((resolve, reject) => {
      const blob = randomBlob(bytes);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', UP_URL, true);
      const start = performance.now();
      xhr.upload.onprogress = (e) => {
        const elapsed = (performance.now() - start) / 1000;
        if(elapsed > 0.05 && e.loaded > 0){
          const mbps = (e.loaded * 8) / elapsed / 1_000_000;
          onProgress(mbps, e.loaded / bytes);
        }
      };
      xhr.onload = () => {
        const elapsed = (performance.now() - start) / 1000;
        resolve((bytes * 8) / elapsed / 1_000_000);
      };
      xhr.onerror = () => reject(new Error('upload failed'));
      xhr.send(blob);
    });
  }

  function fmtMbps(v){
    return v >= 100 ? v.toFixed(0) : v.toFixed(1);
  }

  async function runTest(){
    els.startBtn.disabled = true;
    els.startBtn.textContent = 'Sedang menguji…';
    Object.values(els.steps).forEach(s => s.classList.remove('active','done','error'));
    Object.values(els.vals).forEach(v => v.textContent = '—');
    setProgress(0);

    // Ping
    els.phaseLabel.textContent = 'Mengukur ping';
    setActiveStep('ping');
    setReadout('0', 'ms');
    try{
      const ping = await measurePing(6);
      markDone('ping', Math.round(ping) + ' ms');
    }catch(e){
      markError('ping');
    }

    // Download
    els.phaseLabel.textContent = 'Mengukur kecepatan unduh';
    setActiveStep('download');
    setReadout('0', 'Mbps');
    setProgress(0);
    try{
      const down = await measureDownload(30_000_000, (mbps, frac) => {
        setReadout(fmtMbps(mbps), 'Mbps');
        setProgress(frac);
      });
      markDone('download', fmtMbps(down) + ' Mbps');
      setReadout(fmtMbps(down), 'Mbps');
    }catch(e){
      markError('download');
    }

    // Upload
    els.phaseLabel.textContent = 'Mengukur kecepatan unggah';
    setActiveStep('upload');
    setReadout('0', 'Mbps');
    setProgress(0);
    try{
      const up = await measureUpload(10_000_000, (mbps, frac) => {
        setReadout(fmtMbps(mbps), 'Mbps');
        setProgress(frac);
      });
      markDone('upload', fmtMbps(up) + ' Mbps');
      setReadout(fmtMbps(up), 'Mbps');
    }catch(e){
      markError('upload');
    }

    els.phaseLabel.textContent = 'Tes selesai';
    setActiveStep(null);
    els.startBtn.disabled = false;
    els.startBtn.textContent = 'Tes ulang';
  }

  els.startBtn.addEventListener('click', runTest);
  loadProvider();
})();
</script>
</body>
</html>
